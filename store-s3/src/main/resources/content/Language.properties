s3-binary-store-configuration-name=BFDMS - S3 Store Configuration
s3-binary-store-configuration-description=Backup Friendly Document and Media Storage configuration for the AWS S3 Binary Store.
s3-access-key-name=Access Key
s3-access-key-description=AWS access key ID. Leave empty to use the AWS default credential provider chain (env vars, ~/.aws/credentials, IAM role).
s3-secret-key-name=Secret Key
s3-secret-key-description=AWS secret access key. Leave empty to use the AWS default credential provider chain.
s3-region-name=Region
s3-region-description=AWS region (e.g. us-east-1, eu-west-1). Required by the SDK even when using a custom endpoint.
s3-endpoint-name=Endpoint
s3-endpoint-description=Optional custom S3 endpoint URL for non-AWS S3 services (e.g. https://s3.example.com:9000). Leave empty to use standard AWS.
s3-path-style-access-name=Path-Style Access
s3-path-style-access-description=When enabled, addresses buckets via path style (https://endpoint/bucket/key) instead of virtual host (https://bucket.endpoint/key). Required by many non-AWS S3 services.
s3-bucket-name=Bucket
s3-bucket-description=Bucket name in which to store binaries. Will be created on first store call if it does not exist and "Create Bucket If Missing" is enabled.
s3-namespace-folder-name=Namespace Folder
s3-namespace-folder-description=Optional path prefix inside the bucket. Leave empty to store at the bucket root. Use to share a single bucket between multiple tenants or environments, e.g. "prod/files" or "tenant1".
s3-storage-class-name=Storage Class
s3-storage-class-description=AWS S3 storage class for new objects. Common values: STANDARD (default), STANDARD_IA, INTELLIGENT_TIERING, ONEZONE_IA, GLACIER, GLACIER_IR, DEEP_ARCHIVE, REDUCED_REDUNDANCY.
s3-create-bucket-if-missing-name=Create Bucket If Missing
s3-create-bucket-if-missing-description=When enabled, the bucket is created automatically on first store call if it does not already exist. Disable in production to fail fast on misconfiguration.
s3-connect-timeout-millis-name=Connect Timeout (ms)
s3-connect-timeout-millis-description=TCP connection establishment timeout in milliseconds. Default is 5000 (5 seconds).
s3-socket-timeout-millis-name=Socket Timeout (ms)
s3-socket-timeout-millis-description=Maximum time the client will wait between socket reads and writes, in milliseconds. Applies to both uploads and downloads. Default is 60000 (60 seconds).

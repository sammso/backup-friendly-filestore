minio-binary-store-configuration-name=BFDMS - MinIO Store Configuration
minio-binary-store-configuration-description=Backup Friendly Document and Media Storage configuration for the MinIO Binary Store.
minio-endpoint-name=Endpoint
minio-endpoint-description=MinIO server URL, e.g. http://localhost:9000 or https://minio.example.com.
minio-access-key-name=Access Key
minio-access-key-description=MinIO access key (the username portion of the credentials).
minio-secret-key-name=Secret Key
minio-secret-key-description=MinIO secret key (the password portion of the credentials).
minio-region-name=Region
minio-region-description=Optional. S3 region name. Leave empty to use the MinIO server default.
minio-bucket-name=Bucket
minio-bucket-description=Bucket name in which to store binaries. Will be created on activation if it does not exist and "Create Bucket If Missing" is enabled.
minio-namespace-folder-name=Namespace Folder
minio-namespace-folder-description=Optional path prefix inside the bucket. Leave empty to store at the bucket root. Use to share a single bucket between multiple tenants or environments, e.g. "prod/files" or "tenant1".
minio-create-bucket-if-missing-name=Create Bucket If Missing
minio-create-bucket-if-missing-description=When enabled, the bucket is created automatically on activation if it does not already exist. Disable in production to fail fast on misconfiguration.
minio-connect-timeout-millis-name=Connect Timeout (ms)
minio-connect-timeout-millis-description=TCP connection establishment timeout in milliseconds. Default is 5000 (5 seconds).
minio-write-timeout-millis-name=Write Timeout (ms)
minio-write-timeout-millis-description=Maximum time the client will wait between writing chunks of a request body, in milliseconds. Applies to uploads. Default is 60000 (60 seconds).
minio-read-timeout-millis-name=Read Timeout (ms)
minio-read-timeout-millis-description=Maximum time the client will wait between reading chunks of a response body, in milliseconds. Applies to downloads. Default is 60000 (60 seconds).
